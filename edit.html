<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit your website</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0a2540;
        --cyan: #48cae4;
        --bg: #f4f7fa;
        --bubble-user: #0a2540;
        --bubble-ai: #ffffff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Roboto, system-ui, sans-serif;
        background: var(--bg);
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: var(--navy);
        color: #fff;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        border-bottom: 3px solid var(--cyan);
      }
      header .logo {
        font-family: "Roboto Slab", serif;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: 0.5px;
      }
      header .site {
        margin-left: auto;
        font-size: 13px;
        color: #bcd6e6;
        background: rgba(255, 255, 255, 0.08);
        padding: 5px 12px;
        border-radius: 20px;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .row {
        display: flex;
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
      }
      .row.user {
        justify-content: flex-end;
      }
      .bubble {
        max-width: 78%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .user .bubble {
        background: var(--bubble-user);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .ai .bubble {
        background: var(--bubble-ai);
        color: #1a2733;
        border: 1px solid #e3eaf1;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 8px rgba(10, 37, 64, 0.05);
      }
      .sys .bubble {
        background: #fff4f4;
        color: #8a2b2b;
        border: 1px solid #f2caca;
        font-size: 13px;
      }
      .bubble img.att {
        display: block;
        max-width: 200px;
        max-height: 140px;
        border-radius: 10px;
        margin-top: 8px;
        object-fit: cover;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .chip {
        font-size: 12px;
        font-weight: 500;
        background: rgba(72, 202, 228, 0.14);
        color: #0b5e74;
        border: 1px solid rgba(72, 202, 228, 0.45);
        padding: 3px 10px;
        border-radius: 20px;
        text-decoration: none;
      }
      .chip:hover {
        background: rgba(72, 202, 228, 0.28);
      }

      .typing {
        display: inline-flex;
        gap: 5px;
        padding: 6px 2px;
      }
      .typing span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9db4c4;
        animation: blink 1.2s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }

      #composer {
        flex-shrink: 0;
        padding: 12px 16px 18px;
      }
      #previews {
        max-width: 820px;
        margin: 0 auto 8px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      #previews .pv {
        position: relative;
      }
      #previews img {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 10px;
        border: 2px solid var(--cyan);
      }
      #previews button {
        position: absolute;
        top: -7px;
        right: -7px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: none;
        background: var(--navy);
        color: #fff;
        font-size: 11px;
        cursor: pointer;
        line-height: 1;
      }
      .bar {
        max-width: 820px;
        margin: 0 auto;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        background: #fff;
        border: 1px solid #dbe5ee;
        border-radius: 18px;
        padding: 8px 10px;
        box-shadow: 0 6px 24px rgba(10, 37, 64, 0.08);
      }
      .bar textarea {
        flex: 1;
        border: none;
        outline: none;
        resize: none;
        font-family: inherit;
        font-size: 14.5px;
        line-height: 1.5;
        max-height: 140px;
        padding: 8px 4px;
        background: transparent;
      }
      .iconbtn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      #attach {
        background: #eef4f9;
        color: #41637d;
        font-size: 19px;
      }
      #attach:hover {
        background: #e2ecf4;
      }
      #send {
        background: var(--navy);
        color: #fff;
      }
      #send:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #send svg {
        width: 18px;
        height: 18px;
      }
      .hint {
        max-width: 820px;
        margin: 6px auto 0;
        font-size: 11.5px;
        color: #8aa0b2;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        complete digital<span style="color: var(--cyan)">.</span> site editor
      </div>
      <div class="site" id="siteLabel"></div>
    </header>

    <div id="messages"></div>

    <div id="composer">
      <div id="previews"></div>
      <div class="bar">
        <button class="iconbtn" id="attach" title="Attach an image">
          &#128247;
        </button>
        <input
          type="file"
          id="file"
          accept="image/png,image/jpeg,image/webp,image/gif"
          multiple
          hidden
        />
        <textarea
          id="input"
          rows="1"
          placeholder="Describe a change… e.g. “Change the homepage headline to …”"
        ></textarea>
        <button class="iconbtn" id="send" title="Send">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 2 11 13" />
            <path d="M22 2 15 22l-4-9-9-4 20-7z" />
          </svg>
        </button>
      </div>
      <div class="hint">
        Changes go live on your website within a minute or two. One request at a
        time works best.
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        var WEBHOOK =
          "https://n8n-production-d02c.up.railway.app/webhook/site-editor";

        var qs = new URLSearchParams(location.search);
        var SITE = qs.get("site") || "";
        var TOKEN = qs.get("token") || "";
        var DOMAIN = (qs.get("domain") || "").replace(/\/$/, "");
        document.getElementById("siteLabel").textContent =
          SITE || "no site set";

        var messagesEl = document.getElementById("messages");
        var inputEl = document.getElementById("input");
        var sendBtn = document.getElementById("send");
        var fileBtn = document.getElementById("attach");
        var fileEl = document.getElementById("file");
        var previewsEl = document.getElementById("previews");

        var LS_KEY = "cd-edit-history-" + SITE;
        var history = [];
        try {
          history = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
        } catch (e) {}
        var pending = []; // attached images [{name, b64, dataUrl}]
        var busy = false;

        function save() {
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(history.slice(-40)));
          } catch (e) {}
        }

        function addBubble(role, text, opts) {
          opts = opts || {};
          var row = document.createElement("div");
          row.className = "row " + role;
          var b = document.createElement("div");
          b.className = "bubble";
          b.textContent = text;
          (opts.images || []).forEach(function (src) {
            var img = document.createElement("img");
            img.className = "att";
            img.src = src;
            b.appendChild(img);
          });
          if (opts.changed && opts.changed.length) {
            var chips = document.createElement("div");
            chips.className = "chips";
            var lab = document.createElement("span");
            lab.className = "chip";
            lab.style.background = "#eef4f9";
            lab.style.border = "1px solid #dbe5ee";
            lab.style.color = "#41637d";
            lab.textContent = "Updated:";
            chips.appendChild(lab);
            opts.changed.forEach(function (p) {
              var a = document.createElement("a");
              a.className = "chip";
              a.textContent =
                p === "/" ? "Home page" : p.replace(/\//g, " ").trim();
              if (DOMAIN) {
                a.href = DOMAIN + p;
                a.target = "_blank";
                a.rel = "noopener";
              }
              chips.appendChild(a);
            });
            b.appendChild(chips);
          }
          row.appendChild(b);
          messagesEl.appendChild(row);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          return row;
        }

        function addTyping() {
          var row = document.createElement("div");
          row.className = "row ai";
          row.innerHTML =
            '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
          messagesEl.appendChild(row);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          return row;
        }

        function renderPreviews() {
          previewsEl.innerHTML = "";
          pending.forEach(function (p, i) {
            var d = document.createElement("div");
            d.className = "pv";
            var img = document.createElement("img");
            img.src = p.dataUrl;
            var x = document.createElement("button");
            x.textContent = "×";
            x.onclick = function () {
              pending.splice(i, 1);
              renderPreviews();
            };
            d.appendChild(img);
            d.appendChild(x);
            previewsEl.appendChild(d);
          });
        }

        fileBtn.onclick = function () {
          fileEl.click();
        };
        fileEl.onchange = function () {
          Array.prototype.slice
            .call(fileEl.files)
            .slice(0, 4 - pending.length)
            .forEach(function (f) {
              if (f.size > 4 * 1024 * 1024) {
                addBubble("sys", f.name + " is too large (max 4MB).");
                return;
              }
              var r = new FileReader();
              r.onload = function () {
                var dataUrl = r.result;
                pending.push({
                  name: f.name,
                  b64: dataUrl.split(",")[1],
                  dataUrl: dataUrl,
                });
                renderPreviews();
              };
              r.readAsDataURL(f);
            });
          fileEl.value = "";
        };

        inputEl.addEventListener("input", function () {
          inputEl.style.height = "auto";
          inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
        });
        inputEl.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            send();
          }
        });
        sendBtn.onclick = send;

        function send() {
          if (busy) return;
          var text = inputEl.value.trim();
          if (!text && !pending.length) return;
          if (!SITE || !TOKEN) {
            addBubble(
              "sys",
              "This editor link is missing its site or access code. Please use the exact link we sent you.",
            );
            return;
          }

          var imgs = pending.slice();
          addBubble("user", text || "(image)", {
            images: imgs.map(function (p) {
              return p.dataUrl;
            }),
          });
          history.push({
            role: "user",
            content: text || "(uploaded an image)",
          });
          save();
          inputEl.value = "";
          inputEl.style.height = "auto";
          pending = [];
          renderPreviews();

          busy = true;
          sendBtn.disabled = true;
          var typing = addTyping();

          fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              site: SITE,
              token: TOKEN,
              message: text || "Use the uploaded image(s) where appropriate.",
              history: history.slice(0, -1).slice(-12),
              images: imgs.map(function (p) {
                return { name: p.name, b64: p.b64 };
              }),
            }),
          })
            .then(function (res) {
              if (!res.ok)
                throw new Error(
                  "The editor hit a problem (HTTP " +
                    res.status +
                    "). Please try again.",
                );
              return res.json();
            })
            .then(function (data) {
              typing.remove();
              addBubble("ai", data.reply || "Done.", {
                changed: data.changedUrls || [],
              });
              history.push({
                role: "assistant",
                content: data.reply || "Done.",
              });
              save();
            })
            .catch(function (err) {
              typing.remove();
              addBubble(
                "sys",
                err.message || "Something went wrong — please try again.",
              );
            })
            .finally(function () {
              busy = false;
              sendBtn.disabled = false;
              inputEl.focus();
            });
        }

        // restore previous conversation
        if (history.length) {
          history.slice(-40).forEach(function (m) {
            addBubble(m.role === "assistant" ? "ai" : "user", m.content);
          });
        } else {
          addBubble(
            "ai",
            "Hi! I'm your website editor. Tell me what you'd like to change — wording, photos, prices, anything. You can attach images with the camera button.",
          );
        }
        inputEl.focus();
      })();
    </script>
  </body>
</html>
