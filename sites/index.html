<script>
/* Screenshot/capture mode: load any /sites/<slug>?capture=1 to render the page
   fully painted for screen-grabbing — disables lazy image loading and the
   scroll-reveal animations (so there are no white gaps without scrolling) and
   hides the sales popups. Real visitors (no ?capture=1) are unaffected. */
(function(){
  try{
    if(!/[?&]capture=1(?:&|$)/.test(location.search)) return;
    var css =
      'html .reveal,html .reveal-l,html .reveal-r{opacity:1!important;transform:none!important;transition:none!important}'+
      '#cd-fyi,#cd-cb-popup,#cd-burger{display:none!important}';
    var st=document.createElement('style'); st.id='cd-capture'; st.textContent=css;
    (document.head||document.documentElement).appendChild(st);
    function eager(img){ if(img&&img.getAttribute&&img.getAttribute('loading')==='lazy') img.setAttribute('loading','eager'); }
    /* capture-only: pin the 100vh hero to a fixed height so the /email iframe
       can auto-size it (real visitors keep the full-viewport 100vh hero) */
    function fixHero(){ try{ var d=document.querySelectorAll('div[style]'); for(var i=0;i<d.length;i++){ if(d[i].style && d[i].style.height==='100vh') d[i].style.height='760px'; } }catch(e){} }
    function sweep(){ try{ var l=document.querySelectorAll('img[loading="lazy"]'); for(var i=0;i<l.length;i++) eager(l[i]); }catch(e){} fixHero(); }
    new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){ var a=ms[i].addedNodes; for(var j=0;j<a.length;j++){ var n=a[j];
        if(n.tagName==='IMG') eager(n);
        else if(n.querySelectorAll){ var im=n.querySelectorAll('img[loading="lazy"]'); for(var k=0;k<im.length;k++) eager(im[k]); }
      } }
      fixHero();
    }).observe(document.documentElement,{childList:true,subtree:true});
    document.addEventListener('DOMContentLoaded',sweep);
    window.addEventListener('load',sweep);
  }catch(e){}
})();
</script>
<!-- cd-capture-end -->

<script>
(function(){
  function fb(img){
    if(img.getAttribute("data-fb")==="2")return;
    var w=600,h=400,m=(img.src||"").match(/w=(\d+)&h=(\d+)/);
    if(m){w=m[1];h=m[2];}else{w=img.naturalWidth||img.width||600;h=img.naturalHeight||img.height||400;}
    if(img.getAttribute("data-fb")!=="1"){
      img.setAttribute("data-fb","1");
      img.src="https://picsum.photos/seed/"+encodeURIComponent(((img.alt||"img")+w+h).slice(0,24))+"/"+w+"/"+h;
    }else{
      img.setAttribute("data-fb","2");
      img.src="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><rect width="100%" height="100%" fill="#dfe3e8"/></svg>');
    }
  }
  document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG")fb(t);},true);
})();
</script>
