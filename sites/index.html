    <script>
      /* Screenshot/capture mode: load any /sites/<slug>?capture=1 to render the page
   fully painted for screen-grabbing — disables lazy image loading and the
   scroll-reveal animations (so there are no white gaps without scrolling) and
   hides the sales popups. Real visitors (no ?capture=1) are unaffected. */
      (function () {
        try {
          if (!/[?&]capture=1(?:&|$)/.test(location.search)) return;
          var css =
            "html .reveal,html .reveal-l,html .reveal-r{opacity:1!important;transform:none!important;transition:none!important}" +
            "#cd-fyi,#cd-cb-popup,#cd-burger,#cd-next,#cd-run,#cd-run-ov{display:none!important}";
          var st = document.createElement("style");
          st.id = "cd-capture";
          st.textContent = css;
          (document.head || document.documentElement).appendChild(st);
          function eager(img) {
            if (
              img &&
              img.getAttribute &&
              img.getAttribute("loading") === "lazy"
            )
              img.setAttribute("loading", "eager");
          }
          /* capture-only: pin the 100vh hero to a fixed height so the /email iframe
       can auto-size it (real visitors keep the full-viewport 100vh hero) */
          function fixHero() {
            try {
              var d = document.querySelectorAll("div[style]");
              for (var i = 0; i < d.length; i++) {
                if (d[i].style && d[i].style.height === "100vh")
                  d[i].style.height = "760px";
              }
            } catch (e) {}
          }
          function sweep() {
            try {
              var l = document.querySelectorAll('img[loading="lazy"]');
              for (var i = 0; i < l.length; i++) eager(l[i]);
            } catch (e) {}
            fixHero();
          }
          new MutationObserver(function (ms) {
            for (var i = 0; i < ms.length; i++) {
              var a = ms[i].addedNodes;
              for (var j = 0; j < a.length; j++) {
                var n = a[j];
                if (n.tagName === "IMG") eager(n);
                else if (n.querySelectorAll) {
                  var im = n.querySelectorAll('img[loading="lazy"]');
                  for (var k = 0; k < im.length; k++) eager(im[k]);
                }
              }
            }
            fixHero();
          }).observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
          document.addEventListener("DOMContentLoaded", sweep);
          window.addEventListener("load", sweep);
        } catch (e) {}
      })();
    </script>

    <style>
      /* quote-only treatment (ported from prerender/fuse.cjs) */

      /* full-screen loading screen (slides away after load; sits above the FYI popup) */
      .cd-loader {
        position: fixed;
        inset: 0;
        z-index: 100005;
        background: #0b0b0b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        transition: transform 0.7s cubic-bezier(0.7, 0, 0.2, 1);
      }
      .cd-loader.cd-hide {
        transform: translateY(-100%);
      }
      .cd-loader-name {
        font-family:
          Roboto Slab,
          serif;
        font-weight: 800;
        color: #fff;
        font-size: clamp(28px, 6vw, 56px);
        letter-spacing: 1px;

        animation: cd-loader-fade 0.8s ease 0.1s forwards;

      .cd-loader-slogan {

      @keyframes cd-loader-fade {
        to {

      }
      @keyframes cd-loader-slide {
        0% {

        }
        100% {
          left: 100%;
        }

    <script>
      (function () {
        var CAP = /[?&]capture=1(?:&|$)/.test(location.search);
        var parts = location.pathname
          .split("/")
          .filter(Boolean); /* ["sites", slug, route?] */
        if (
          parts[0] !== "sites" ||
          !parts[1] ||
          parts[1] === "configs" ||
          parts[1] === "images" ||
          parts[1] === "assets"
        )
          return;
        var slug = parts[1],
          route = parts[2] || "home";

        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function telHref(p) {
          return "tel:" + String(p || "").replace(/[^\d+]/g, "");
        }

        /* --- loading screen: shown immediately (before React renders), filled
         from the config when it arrives, hidden after load --- */
        var loader = null;
        if (!CAP) {
          loader = document.createElement("div");
          loader.className = "cd-loader";
          loader.setAttribute("data-cd", "loader");
          loader.innerHTML =
            '<div class="cd-loader-name"></div><div class="cd-loader-slogan"></div><div class="cd-loader-bar"></div>';
          document.body.insertBefore(loader, document.body.firstChild);
          var hidden = false;
          var shownAt = Date.now();
          function hide() {
            if (hidden || !loader) return;
            hidden = true;
            loader.classList.add("cd-hide");
            setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 800);
          }
          function maybeHide() {
            if (document.readyState !== "complete") return;
            var root = document.getElementById("root");
            if (!root || !root.children.length) {
              setTimeout(maybeHide, 150);
              return;
            }
            setTimeout(hide, Math.max(0, 600 - (Date.now() - shownAt)));
          }
          if (document.readyState === "complete") {
            maybeHide();
          } else {
            window.addEventListener("load", maybeHide);
          }
          setTimeout(hide, 6000); /* failsafe */
        }

        /* Call + Email button pair (email inert when the config has no address) */
        function ctaButtonsHtml(cfg, opts) {
          opts = opts || {};
          var outline =
            "btn-outline" + (opts.light ? " btn-outline-light" : "");
          var call = cfg.phone
            ? '<a href="' +
              telHref(cfg.phone) +
              '" class="btn-yellow" style="font-size:14px;padding:15px 34px;">' +
              esc(opts.callLabel || "Call " + cfg.phone) +
              "</a>"
            : "";
          var email =
            "<a" +
            (cfg.email ? ' href="mailto:' + esc(cfg.email) + '"' : "") +
            ' class="' +
            outline +
            '" style="font-size:14px;padding:13px 34px;">Email Us</a>';
          return call + email;
        }
        function quoteOnlyParas(cfg) {
          if (cfg.quoteOnlyText)
            return (
              Array.isArray(cfg.quoteOnlyText)
                ? cfg.quoteOnlyText
                : [cfg.quoteOnlyText]
            ).map(esc);
          var trade = (cfg.trade || cfg.siteType || "").toLowerCase();
          var job = trade ? trade + " job" : "job";
          return [
            "Some " +
              esc(job) +
              "s are a quick fix and you're sorted the same day. Others take real time and care to get right. No two are ever quite the same, and we'd rather not pretend they are by putting a one-size-fits-all price on yours.",
            "That's exactly why we're quote-only. We take a proper look at what you actually need and give you an honest, fixed price — nothing padded, nothing you didn't ask for. The quote is completely free, with no obligation to go ahead. If it turns out you only need a small fix, we'll tell you that too.",
          ];
        }
        function buildQuoteOnlySection(cfg) {
          var trade = (cfg.trade || cfg.siteType || "").toLowerCase();
          var heading = cfg.quoteOnlyHeading
            ? esc(cfg.quoteOnlyHeading)
            : "Every " + esc(trade ? trade + " job" : "job") + " is different";
          var paras = quoteOnlyParas(cfg);
          var ps = paras
            .map(function (p, i) {
              return (
                '<p style="font-family:Roboto,sans-serif;font-size:16px;color:rgb(85,85,85);line-height:1.85;margin-bottom:' +
                (i === paras.length - 1 ? "36px" : "18px") +
                ';">' +
                p +
                "</p>"
              );
            })
            .join("");
          return (
            '<section id="quote-only" style="padding:64px 30px 76px;">' +
            '<div class="mx-auto" style="max-width:760px;text-align:center;">' +
            '<div class="section-label" style="color:var(--color-primary);">Quote Only</div>' +
            '<h2 class="section-h2 cd-quote-h2">' +
            heading +
            "</h2>" +
            ps +
            '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">' +
            ctaButtonsHtml(cfg, {}) +
            "</div></div></section>"
          );
        }
        function buildNotifySection() {
          return (
            '<section id="discount-notify" style="background:rgb(245,245,245);padding:56px 30px 64px;">' +
            '<div class="mx-auto" style="max-width:560px;text-align:center;">' +
            '<h2 class="section-h2" style="font-size:24px;margin-bottom:10px;">Get notified when we have a discount</h2>' +
            '<p style="font-family:Roboto,sans-serif;font-size:14px;color:rgb(85,85,85);margin-bottom:24px;">Leave your number or email below and we\'ll let you know.</p>' +
            '<form data-cd="discount-notify" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">' +
            '<input type="text" required placeholder="Phone number or email" style="flex:1 1 240px;max-width:340px;border:1.5px solid rgb(204,204,204);padding:12px 14px;font-family:Roboto,sans-serif;font-size:14px;color:rgb(51,51,51);background:rgb(255,255,255);outline:none;">' +
            '<button type="submit" class="btn-yellow" style="font-size:13px;">Notify Me</button>' +
            "</form></div></section>"
          );
        }
        /* Static replacement for the home-page price calculator card. */
        function buildQuoteCardInner(cfg) {
          function li(t) {
            return (
              '<li style="font-family:Roboto,sans-serif;font-size:14px;color:rgb(26,26,26);display:flex;gap:11px;align-items:center;"><span style="color:var(--color-primary);font-weight:800;">✓</span>' +
              t +
              "</li>"
            );
          }
          var call = cfg.phone
            ? '<a href="' +
              telHref(cfg.phone) +
              '" class="btn-yellow" style="justify-content:center;width:100%;margin-bottom:12px;">Call ' +
              esc(cfg.phone) +
              "</a>"
            : "";
          return (
            '<h3 style="font-family:Roboto Slab,serif;font-weight:700;font-size:24px;color:rgb(26,26,26);margin-bottom:14px;">Get a Free Quote</h3>' +
            "<p style=\"font-family:Roboto,sans-serif;font-size:14px;color:rgb(85,85,85);line-height:1.7;margin-bottom:26px;\">Every job is different, so we don't do guesswork. Tell us what you need and we'll give you a clear, fixed quote &mdash; free and no obligation.</p>" +
            '<ul style="list-style:none;padding:0px;margin:0px 0px 28px;display:flex;flex-direction:column;gap:12px;">' +
            li("Free, no-obligation quotes") +
            li("Upfront fixed pricing, no surprises") +
            li("Fully licensed &amp; insured") +
            "</ul>" +
            call +
            '<a href="/sites/' +
            esc(slug) +
            '/contact" class="btn-outline" style="width:100%;">Get a Quote</a>'
          );
        }

        /* --- post-render transforms (idempotent; re-run while React settles) --- */
        function apply(cfg) {
          /* home calculator -> static quote card; price rows -> "Quote only" */
          var pricesSec = document.getElementById("prices");
          if (pricesSec) {
            var card = pricesSec.querySelector(".pricing-calc-card");
            if (card && card.getAttribute("data-cd-quote") !== "1") {
              card.setAttribute("data-cd-quote", "1");
              card.innerHTML = buildQuoteCardInner(cfg);
            }
            var rows = pricesSec.querySelectorAll(".price-row");
            for (var i = 0; i < rows.length; i++) {
              var val = rows[i].lastElementChild;
              if (
                val &&
                val.tagName === "SPAN" &&
                !val.classList.contains("price-dots") &&
                val.textContent !== "Quote only"
              )
                val.textContent = "Quote only";
            }
          }
          /* pricing page: price sections -> quote-only text block + notify form */
          if (route === "pricing" && !document.getElementById("quote-only")) {
            var main = document.querySelector("#root main");
            if (main && main.children.length) {
              var first = main.children[0];
              var contactSec = document.getElementById("contact");
              var kids = [].slice.call(main.children);
              for (var j = 0; j < kids.length; j++) {
                if (kids[j] !== first && kids[j] !== contactSec)
                  main.removeChild(kids[j]);
              }
              var holder = document.createElement("div");
              holder.innerHTML =
                buildQuoteOnlySection(cfg) + buildNotifySection();
              while (holder.firstChild)
                main.insertBefore(holder.firstChild, contactSec || null);
            }
          }
          /* contact band: inert "Get a Quote" button -> working Call/Email links */
          var contactBand = document.getElementById("contact");
          if (contactBand) {
            var bandBtn = contactBand.querySelector(
              "div.reveal-r > button.btn-yellow",
            );
            if (bandBtn) {
              var wrap = bandBtn.parentElement;
              wrap.style.display = "flex";
              wrap.style.gap = "12px";
              wrap.style.flexWrap = "wrap";
              wrap.style.justifyContent = "center";
              wrap.innerHTML = ctaButtonsHtml(cfg, {
                callLabel: "Call Now",
                light: true,
              });
            }
          }
        }

        /* discount-notify submit: confirmation instead of submitting (no backend) */
        document.addEventListener(
          "submit",
          function (e) {
            var form = e.target;
            if (
              !form ||
              !form.getAttribute ||
              form.getAttribute("data-cd") !== "discount-notify"
            )
              return;
            e.preventDefault();
            var input = form.querySelector("input");
            if (!input || !input.value.trim()) return;
            try {
              window.__cdTrack && window.__cdTrack("discount_notify_submit");
            } catch (err) {}
            var p = document.createElement("p");
            p.style.cssText =
              "font-family:Roboto;font-size:14px;color:#1bd760;font-weight:700";
            p.textContent = "Thanks! We'll let you know when a discount is on.";
            form.parentNode.replaceChild(p, form);
          },
          true,
        );

        fetch("/sites/configs/" + slug + ".json")
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (cfg) {
            if (!cfg) return;
            if (loader) {
              loader.firstChild.textContent =
                cfg.businessName || cfg.logoPrefix || slug;
              loader.children[1].textContent =
                (cfg.heroSlides &&
                  cfg.heroSlides[0] &&
                  cfg.heroSlides[0].title) ||
                cfg.tagline ||
                "";
              if (cfg.primaryColor)
                loader.style.setProperty("--color-primary", cfg.primaryColor);
            }
            /* apply once the engine has rendered; watch briefly for late renders */
            var tries = 0;
            (function tick() {
              if (document.querySelector("#root main")) {
                try {
                  apply(cfg);
                } catch (err) {}
              }
              if (++tries < 40)
                setTimeout(tick, 250); /* keep re-applying for ~10s */
            })();
          })
          .catch(function () {});
      })();
    </script>

    <script>
      (function () {
        function fb(img) {
          if (img.getAttribute("data-fb") === "2") return;
          var w = 600,
            h = 400,
            m = (img.src || "").match(/w=(\d+)&h=(\d+)/);
          if (m) {
            w = m[1];
            h = m[2];
          } else {
            w = img.naturalWidth || img.width || 600;
            h = img.naturalHeight || img.height || 400;
          }
          if (img.getAttribute("data-fb") !== "1") {
            img.setAttribute("data-fb", "1");
            img.src =
              "https://picsum.photos/seed/" +
              encodeURIComponent(((img.alt || "img") + w + h).slice(0, 24)) +
              "/" +
              w +
              "/" +
              h;
          } else {
            img.setAttribute("data-fb", "2");
            img.src =
              "data:image/svg+xml;utf8," +
              encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="' +
                  w +
                  '" height="' +
                  h +
                  '"><rect width="100%" height="100%" fill="#dfe3e8"/></svg>',
              );
          }
        }
        document.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "IMG") fb(t);
          },
          true,
        );
      })();
    </script>

      (function () {

          "https://n8n-production-d02c.up.railway.app/webhook/2f49e19f-cf37-4bb8-a09d-8d7799b9fec4";
        window.__cdTrack = function (event, extra) {

            var d = {
              event: event,
              url: location.origin + location.pathname,
              path: location.pathname,
              slug: location.pathname.split("/").filter(Boolean)[1] || "",
              referrer: document.referrer || "",
              userAgent: navigator.userAgent,
              language: navigator.language || "",
              screen: screen.width + "x" + screen.height,
              viewport: window.innerWidth + "x" + window.innerHeight,
              title: document.title,
              ts: new Date().toISOString(),
            };
            if (extra) {
              for (var k in extra) {
                d[k] = extra[k];
              }
            }
            var body = JSON.stringify(d);
            try {
              fetch(WEBHOOK, {
                method: "POST",
                mode: "cors",
                keepalive: true,
                headers: { "Content-Type": "application/json" },
                body: body,
              });
            } catch (e) {
              try {
                if (navigator.sendBeacon)
                  navigator.sendBeacon(
                    WEBHOOK,
                    new Blob([body], { type: "application/json" }),
                  );
              } catch (e2) {}
            }
          } catch (e) {}
        };
        if (!/[?&]capture=1(?:&|$)/.test(location.search))
          window.__cdTrack("pageview");
      })();
    </script>
    <!-- cd-track-end -->
    <!-- cd-fyi-start -->
    <script>
      (function () {
        var NAVY = "#0a2540",
          CYAN = "#48cae4";
        var LINKS = [
          { t: "Home", h: "https://www.completedigital.org" },
          { t: "Example website", h: "#" },
          { t: "How this works", h: "https://www.completedigital.org" },
        ];
        function showBurger() {
          if (document.getElementById("cd-burger")) return;
          var wrap = document.createElement("div");
          wrap.id = "cd-burger";
          wrap.style.cssText =
            "position:fixed;top:18px;right:18px;z-index:100000;font-family:Roboto,system-ui,sans-serif";
          var btn = document.createElement("button");
          btn.setAttribute("aria-label", "Menu");
          btn.style.cssText =
            "width:46px;height:46px;border-radius:12px;border:none;cursor:pointer;background:" +
            NAVY +
            ";color:#fff;box-shadow:0 6px 20px rgba(10,37,64,.35);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1";
          btn.innerHTML = "&#9776;";
          var menu = document.createElement("div");
          menu.style.cssText =
            "position:absolute;top:54px;right:0;min-width:196px;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);overflow:hidden;display:none;border-top:3px solid " +
            CYAN;
          menu.innerHTML = LINKS.map(function (l, i) {
            var ext = l.h.indexOf("http") === 0;
            return (
              '<a href="' +
              l.h +
              '" ' +
              (ext ? 'target="_blank" rel="noopener"' : "") +
              ' style="display:block;padding:13px 18px;color:' +
              NAVY +
              ";text-decoration:none;font-size:14px;font-weight:600;" +
              (i < LINKS.length - 1 ? "border-bottom:1px solid #eef2f6" : "") +
              '">' +
              l.t +
              "</a>"
            );
          }).join("");
          wrap.appendChild(btn);
          wrap.appendChild(menu);
          document.body.appendChild(wrap);
          var open = false;
          btn.onclick = function (e) {
            e.stopPropagation();
            open = !open;
            menu.style.display = open ? "block" : "none";
          };
          document.addEventListener("click", function () {
            if (open) {
              open = false;
              menu.style.display = "none";
            }
          });
        }
        function showFYI() {
          if (
            document.getElementById("cd-fyi") ||
            document.getElementById("cd-burger")
          )
            return;
          try {
            if (sessionStorage.getItem("cd-fyi-seen")) return;
            sessionStorage.setItem("cd-fyi-seen", "1");
          } catch (e) {}
          var ov = document.createElement("div");
          ov.id = "cd-fyi";
          ov.style.cssText =
            "position:fixed;inset:0;z-index:100001;background:rgba(6,24,43,.6);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Roboto,system-ui,sans-serif;opacity:0;transition:opacity .25s ease";
          ov.innerHTML =
            '<div role="dialog" aria-label="FYI" style="position:relative;background:#fff;border-radius:22px;max-width:460px;width:100%;padding:42px 32px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;transform:scale(.94);transition:transform .25s ease;border-top:5px solid ' +
            CYAN +
            '">' +
            '<button id="cd-fyi-x" aria-label="Close" style="position:absolute;top:12px;right:16px;border:none;background:none;font-size:26px;line-height:1;cursor:pointer;color:' +
            NAVY +
            ';padding:4px">&times;</button>' +
            '<div style="font-size:46px;font-weight:800;letter-spacing:1px;color:' +
            NAVY +
            ';margin-bottom:14px;font-family:Roboto Slab,serif">FYI</div>' +
            '<p style="font-size:15px;line-height:1.6;color:#444;margin:0 0 18px">You get your own dashboard where you can change text, images, colours and more &mdash; easily. Just click &ldquo;Get it running&rdquo; and your website will be up in 2 minutes.</p>' +
            '<p style="font-size:18px;line-height:1.4;font-weight:800;color:' +
            NAVY +
            ';margin:0 0 24px">YES, IT&rsquo;S FREE.</p>' +
            '<a id="cd-fyi-dash" href="https://www.completedigital.org/dashboard" target="_blank" rel="noopener" style="display:block;box-sizing:border-box;text-decoration:none;border:none;border-radius:10px;padding:13px 24px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:' +
            NAVY +
            ';color:#fff;width:100%;text-align:center">See the dashboard</a>' +
            '<button id="cd-fyi-go" style="border:none;background:none;margin-top:12px;padding:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:' +
            NAVY +
            ';text-decoration:underline;width:100%">See the website</button>' +
            "</div>";
          document.body.appendChild(ov);
          requestAnimationFrame(function () {
            ov.style.opacity = "1";
            ov.firstChild.style.transform = "scale(1)";
          });
          var dismissed = false;
          function dismiss() {
            if (dismissed) return;
            dismissed = true;
            ov.style.opacity = "0";
            setTimeout(function () {
              if (ov.parentNode) ov.parentNode.removeChild(ov);
            }, 250);
            try {
              document.dispatchEvent(new CustomEvent("cd-fyi-dismissed"));
            } catch (e) {}
          }
          document.getElementById("cd-fyi-x").onclick = dismiss;
          ov.addEventListener("click", function (e) {
            if (e.target === ov) dismiss();
          });
          document.getElementById("cd-fyi-dash").onclick = function () {
            try {
              window.__cdTrack && window.__cdTrack("fyi_see_dashboard");
            } catch (e) {}
            dismiss();
          };
          document.getElementById("cd-fyi-go").onclick = function () {
            try {
              window.__cdTrack && window.__cdTrack("fyi_see_website");
            } catch (e) {}
            dismiss();
          };
        }
        if (document.body) {
          showFYI();
        } else {
          document.addEventListener("DOMContentLoaded", showFYI);
        }
      })();
    </script>
    <!-- cd-fyi-end -->
    <!-- cd-run-start -->
    <script>
      (function () {
        /* "Get it running" — bottom-centre prompt that appears 3s after the
     FYI popup is dismissed (or 3s after load on pages where the FYI was
     already seen this session). Clicking it POSTs the site slug to the
     provisioning webhook and shows a progress overlay until the dashboard
     credentials come back. Hidden in ?capture=1 screenshot mode. */
        var NAVY = "#0a2540",
          CYAN = "#48cae4";
        var HOOK =
          "https://n8n-production-d02c.up.railway.app/webhook/6f32b0a5-4c51-49b2-bad6-f8e5150a8cbd";
        var MSGS = [
          "Reserving your space…",
          "Building container…",
          "Copying your website in…",
          "Pointing the internet at it…",
          "Provisioning your dashboard…",
          "Creating your login…",
          "Polishing the pixels…",
          "Final checks…",
        ];
        if (/[?&]capture=1(?:&|$)/.test(location.search)) return;
        try {
          if (sessionStorage.getItem("cd-run-closed")) return;
        } catch (e) {}
        var slug = location.pathname.split("/").filter(Boolean)[1] || "";
        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }
        function showPrompt() {
          if (
            document.getElementById("cd-run") ||
            document.getElementById("cd-run-ov")
          )
            return;
          var w = document.createElement("div");
          w.id = "cd-run";
          w.setAttribute("role", "dialog");
          w.setAttribute("aria-label", "Get it running");
          w.style.cssText =
            "position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);z-index:100000;width:calc(100vw - 24px);max-width:340px;background:#fff;border-radius:18px;border-top:4px solid " +
            CYAN +
            ";box-shadow:0 16px 50px rgba(10,37,64,.35);padding:30px 14px 14px;font-family:Roboto,system-ui,sans-serif;opacity:0;transition:opacity .35s ease,transform .35s ease;box-sizing:border-box";
          w.innerHTML =
            '<button id="cd-run-x" aria-label="Close" style="position:absolute;top:6px;right:10px;border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:#999;padding:4px">&times;</button>' +
            '<button id="cd-run-go" style="display:block;width:100%;box-sizing:border-box;border:none;border-radius:12px;padding:15px 16px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;background:' +
            NAVY +
            ';color:#fff">Get it running</button>';
          document.body.appendChild(w);
          requestAnimationFrame(function () {
            w.style.opacity = "1";
            w.style.transform = "translate(-50%,0)";
          });
          try {
            window.__cdTrack && window.__cdTrack("run_prompt_shown");
          } catch (e) {}
          document.getElementById("cd-run-x").onclick = function () {
            try {
              sessionStorage.setItem("cd-run-closed", "1");
            } catch (e) {}
            w.style.opacity = "0";
            w.style.transform = "translate(-50%,20px)";
            setTimeout(function () {
              if (w.parentNode) w.parentNode.removeChild(w);
            }, 350);
          };
          document.getElementById("cd-run-go").onclick = function () {
            try {
              window.__cdTrack && window.__cdTrack("run_click");
            } catch (e) {}
            if (w.parentNode) w.parentNode.removeChild(w);
            showProgress();
          };
        }
        function showProgress() {
          if (document.getElementById("cd-run-ov")) return;
          var ov = document.createElement("div");
          ov.id = "cd-run-ov";
          ov.style.cssText =
            "position:fixed;inset:0;z-index:100002;background:rgba(6,24,43,.72);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Roboto,system-ui,sans-serif;opacity:0;transition:opacity .25s ease";
          ov.innerHTML =
            '<div role="dialog" aria-label="Setting up your website" style="position:relative;background:#fff;border-radius:22px;max-width:460px;width:100%;padding:38px 32px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;border-top:5px solid ' +
            CYAN +
            '">' +
            '<button id="cd-run-ov-x" aria-label="Close" style="position:absolute;top:10px;right:14px;border:none;background:none;font-size:24px;line-height:1;cursor:pointer;color:#999;padding:4px">&times;</button>' +
            '<div id="cd-run-title" style="font-size:24px;font-weight:800;color:' +
            NAVY +
            ';margin-bottom:10px;font-family:Roboto Slab,serif">Setting up your website</div>' +
            '<p id="cd-run-msg" style="font-size:14px;min-height:20px;color:#444;margin:0 0 18px">' +
            MSGS[0] +
            "</p>" +
            '<div style="background:#e8eef4;border-radius:99px;height:12px;overflow:hidden"><div id="cd-run-bar" style="height:100%;width:2%;border-radius:99px;background:linear-gradient(90deg,' +
            CYAN +
            "," +
            NAVY +
            ');transition:width .6s ease"></div></div>' +
            '<div id="cd-run-body" style="margin-top:18px"></div>' +
            "</div>";
          document.body.appendChild(ov);
          requestAnimationFrame(function () {
            ov.style.opacity = "1";
          });
          var bar = document.getElementById("cd-run-bar");
          var msg = document.getElementById("cd-run-msg");
          var body = document.getElementById("cd-run-body");
          var t0 = Date.now();
          var mi = 0,
            done = false;
          function closeOv() {
            try {
              sessionStorage.setItem("cd-run-closed", "1");
            } catch (e) {}
            ov.style.opacity = "0";
            setTimeout(function () {
              if (ov.parentNode) ov.parentNode.removeChild(ov);
            }, 250);
          }
          document.getElementById("cd-run-ov-x").onclick = closeOv;
          /* ease to 95% over 30s, then hold until the webhook responds */
          var tick = setInterval(function () {
            if (done) return;
            var t = Math.min(1, (Date.now() - t0) / 30000);
            bar.style.width = 95 * (1 - Math.pow(1 - t, 2)) + "%";
          }, 500);
          var rot = setInterval(function () {
            if (done) return;
            mi = (mi + 1) % MSGS.length;
            msg.textContent = MSGS[mi];
          }, 3800);
          function finish(data) {
            if (done) return;
            done = true;
            clearInterval(tick);
            clearInterval(rot);
            bar.style.width = "100%";
            msg.textContent = "Done — your website is live.";
            var user = data.username || data.user || "";
            var pass = data.password || data.pass || "";
            var link =
              data.dashboard ||
              data.dashboardLink ||
              data.dashboard_link ||
              data.dashboard_url ||
              data.link ||
              data.url ||
              "";
            function row(label, val) {
              return (
                '<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid #e2e9f0;border-radius:10px;margin-bottom:8px;font-size:14px;text-align:left"><span style="color:#667;font-weight:600">' +
                label +
                '</span><span style="color:' +
                NAVY +
                ';font-weight:700;word-break:break-all;user-select:all">' +
                esc(val) +
                "</span></div>"
              );
            }
            body.innerHTML =
              row("Username", user) +
              row("Password", pass) +
              (link
                ? '<a href="' +
                  esc(link) +
                  '" target="_blank" rel="noopener" style="display:block;box-sizing:border-box;text-align:center;text-decoration:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;background:' +
                  NAVY +
                  ';color:#fff;margin-top:12px">Open your dashboard</a>'
                : "") +
              '<p style="font-size:12px;color:#888;margin:12px 0 0">Save these details — you’ll need them to log in.</p>';
            try {
              window.__cdTrack && window.__cdTrack("run_ready");
            } catch (e) {}
          }
          function fail() {
            if (done) return;
            done = true;
            clearInterval(tick);
            clearInterval(rot);
            document.getElementById("cd-run-title").textContent =
              "Almost there";
            msg.textContent = "";
            body.innerHTML =
              '<p style="font-size:14px;line-height:1.6;color:#444;margin:0">This is taking a little longer than usual. Your website is still being set up in the background — we’ll send your login details shortly.</p>' +
              '<button id="cd-run-ok" style="border:none;border-radius:10px;padding:12px 22px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:' +
              NAVY +
              ';color:#fff;margin-top:14px">Close</button>';
            document.getElementById("cd-run-ok").onclick = closeOv;
            try {
              window.__cdTrack && window.__cdTrack("run_timeout");
            } catch (e) {}
          }
          /* keep at least 6s of theatre even if the response is instant */
          function finishWhenReady(data) {
            var wait = Math.max(0, 6000 - (Date.now() - t0));
            setTimeout(function () {
              finish(data);
            }, wait);
          }
          var ctl = window.AbortController ? new AbortController() : null;
          var cap = setTimeout(function () {
            if (ctl) ctl.abort();
            fail();
          }, 240000);
          fetch(HOOK, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              slug: slug,
              url: location.origin + location.pathname,
            }),
            signal: ctl ? ctl.signal : undefined,
          })
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.json();
            })
            .then(function (data) {
              clearTimeout(cap);
              finishWhenReady(data || {});
            })
            .catch(function () {
              clearTimeout(cap);
              fail();
            });
        }
        function arm() {
          setTimeout(showPrompt, 3000);
        }
        document.addEventListener("cd-fyi-dismissed", arm);
        function boot() {
          /* the FYI script runs before this one; if it didn't open on this
       page (already seen this session), arm the timer straight away */
          if (!document.getElementById("cd-fyi")) arm();
        }
        if (document.body) {
          boot();
        } else {
          document.addEventListener("DOMContentLoaded", boot);
        }
      })();
    </script>
    <!-- cd-run-end -->
  </body>
</html>
