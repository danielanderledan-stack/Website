<script>
(function(){
  var WEBHOOK="https://n8n-production-d02c.up.railway.app/webhook/4040499f-40d1-4b76-8af7-4a6df6dfbe6b";
  function show(){
    if(document.getElementById("cd-cb-popup"))return;
    var primary=(getComputedStyle(document.documentElement).getPropertyValue("--color-primary")||"").trim()||"#1E3A8A";
    var w=document.createElement("div");
    w.id="cd-cb-popup";w.setAttribute("role","dialog");w.setAttribute("aria-label","Callback request");
    w.style.cssText="position:fixed;bottom:24px;right:24px;z-index:99999;width:300px;max-width:calc(100vw - 32px);background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:22px 22px 20px;font-family:Roboto,system-ui,sans-serif;color:#1a1a1a;opacity:0;transform:translateY(12px);transition:opacity .3s ease,transform .3s ease";
    w.innerHTML=
      '<button id="cd-cb-x" aria-label="Close" style="position:absolute;top:8px;right:12px;border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:#999;padding:4px">&times;</button>'+

      '<div style="font-size:13px;color:#777;margin-bottom:16px">We&#39;ll keep it quick.</div>'+

    document.body.appendChild(w);
    requestAnimationFrame(function(){w.style.opacity="1";w.style.transform="translateY(0)"});
    function close(){w.style.opacity="0";w.style.transform="translateY(12px)";setTimeout(function(){if(w.parentNode)w.parentNode.removeChild(w)},300)}
    document.getElementById("cd-cb-x").onclick=close;
    document.getElementById("cd-cb-yes").onclick=function(){
      try{fetch(WEBHOOK,{method:"POST",mode:"no-cors",keepalive:true,body:JSON.stringify({website:location.href,url:location.href,ts:new Date().toISOString()})})}catch(e){}
      w.innerHTML='<div style="font-size:16px;font-weight:700;padding:6px 0">Thanks! &#128075;</div><div style="font-size:13px;color:#777;margin-top:6px">We&#39;ll be in touch shortly.</div>';
      setTimeout(close,2200);
    };
  }
  setTimeout(show,8000);
})();
</script>
